[alembic]
# Path to the alembic/ directory with env.py and versions/
script_location = alembic

# The URL is built dynamically in env.py from .env + config/database.yaml
# so this value is overridden at runtime. Keeping a placeholder here.
sqlalchemy.url = postgresql://localhost/demo

# Template used to generate migration file names
# file_template = %%(rev)s_%%(slug)s

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
